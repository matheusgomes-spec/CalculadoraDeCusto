<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" role="img" aria-label="PipeLovers">
  <!-- PIPE text -->
  <text x="10" y="60" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#000000" letter-spacing="2">PIPE</text>
  
  <!-- LOVERS text -->
  <text x="190" y="60" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#000000" letter-spacing="2">LOVERS</text>
  
  <!-- Heart icon with pipeline -->
  <g transform="translate(340, 28)">
    <!-- Outer heart shape -->
    <path d="M 0,-8 C -8,-16 -20,-16 -20,-4 C -20,8 0,24 0,24 C 0,24 20,8 20,-4 C 20,-16 8,-16 0,-8 Z" 
          fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner pipeline circles -->
    <circle cx="-8" cy="0" r="3.5" fill="#000000"/>
    <circle cx="8" cy="0" r="3.5" fill="#000000"/>
    <circle cx="0" cy="12" r="3.5" fill="#000000"/>
    
    <!-- Pipeline connections -->
    <line x1="-8" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
